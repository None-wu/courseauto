<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模拟网页版 AI 对话</title>
<style>
  body { margin: 0; font: 14px/1.7 "Microsoft YaHei", sans-serif; background: #0f1115; color: #e6e8ee; }
  header { padding: 10px 14px; border-bottom: 1px solid #232733; color: #9aa3b5; font-size: 12px; }
  #msgs { padding: 14px; height: 480px; overflow-y: auto; }
  .msg { max-width: 84%; padding: 9px 12px; border-radius: 10px; margin-bottom: 10px; white-space: pre-wrap; }
  .msg.me { margin-left: auto; background: #1d4ed8; color: #fff; }
  .msg.ai { background: #1a1f2b; border: 1px solid #262c3a; }
  .composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #232733; }
  textarea { flex: 1; height: 74px; resize: none; background: #161a23; color: #e6e8ee;
             border: 1px solid #2a3040; border-radius: 8px; padding: 8px 10px; font: inherit; }
  button { align-self: flex-end; height: 34px; padding: 0 18px; border: 0; border-radius: 8px;
           background: #2563eb; color: #fff; cursor: pointer; font: inherit; }
  button:hover { background: #1d4ed8; }
  /* 附件区:真实站点(元宝/Kimi/DeepSeek)都有「上传图片」按钮 + 隐藏 file input,
     桥脚本靠给这个 input 赋 files 把题目图片带上去 */
  #pending { display: flex; gap: 6px; padding: 0 14px; }
  #pending:empty { display: none; }
  #pending img { height: 46px; border-radius: 6px; border: 1px solid #2a3040; }
  #file { position: absolute; left: -9999px; width: 1px; height: 1px; }
</style>
</head>
<body>
<header>模拟网页版 AI(结构:输入框 + 发送按钮 + 回复气泡 + 图片上传),真实站点由「学习通网页AI桥」适配</header>
<div id="msgs"></div>
<div id="pending"></div>
<input id="file" type="file" accept="image/*" multiple>
<div class="composer">
  <textarea id="ask" placeholder="在这里输入问题…"></textarea>
  <button id="send" type="button">发送</button>
</div>
<script>
  var msgs = document.getElementById('msgs');
  var ask = document.getElementById('ask');
  var pending = [];
  var pendingBox = document.getElementById('pending');
  var fileEl = document.getElementById('file');

  // 收到的附件:画成缩略图(桥脚本用 img 数量变化判断"上传完成"),
  // 并把收到的张数暴露给测试(window.__imgCount / __lastSentImgs)
  function addFiles(list) {
    Array.prototype.forEach.call(list || [], function (f) {
      if (!f || !/^image\//.test(f.type || '')) return;
      pending.push(f);
      var im = document.createElement('img');
      im.src = URL.createObjectURL(f);
      pendingBox.appendChild(im);
    });
    window.__imgCount = pending.length;
  }
  fileEl.addEventListener('change', function () { addFiles(fileEl.files); });
  // 部分站点用「粘贴图片」而不是 file input,这里一起支持
  document.addEventListener('paste', function (e) {
    var dt = e.clipboardData;
    if (dt && dt.files && dt.files.length) addFiles(dt.files);
  });

  function bubble(cls, text) {
    var d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function toDataUrl(f) {
    return new Promise(function (resolve) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result || '')); };
      fr.onerror = function () { resolve(''); };
      fr.readAsDataURL(f);
    });
  }

  document.getElementById('send').addEventListener('click', async function () {
    var text = (ask.value || '').trim();
    if (!text) return;
    // 测试断言:这次提问带了几张图
    window.__lastSentImgs = pending.length;
    var imgs = pending.slice();
    bubble('msg me', text + (imgs.length ? '\n[附图 ' + imgs.length + ' 张]' : ''));
    ask.value = '';
    pending = [];
    pendingBox.innerHTML = '';
    window.__imgCount = 0;

    try {
      // 有图就按 OpenAI 多模态格式发(text + image_url parts),否则纯文本
      var content = text;
      if (imgs.length) {
        content = [{ type: 'text', text: text }];
        for (var i = 0; i < imgs.length; i++) {
          content.push({ type: 'image_url', image_url: { url: await toDataUrl(imgs[i]) } });
        }
      }
      var res = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: content }] })
      });
      var obj = await res.json();
      var answer = (obj.choices && obj.choices[0] && obj.choices[0].message.content) || '(空)';
      // 类名带 markdown-body:桥脚本用通用选择器即可命中
      bubble('msg ai markdown-body', answer);
    } catch (e) {
      bubble('msg ai markdown-body', '请求失败:' + e.message);
    }
  });
</script>
</body>
</html>

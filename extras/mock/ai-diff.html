<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模拟网页 AI(仿元宝结构/无已知回复选择器)</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#1a1a1e;color:#eee;display:flex;flex-direction:column;height:100vh}
  #chat{flex:1;overflow-y:auto;padding:16px}
  .agent-chat__item{max-width:70%;margin:8px 0;padding:10px 14px;border-radius:12px;white-space:pre-wrap;font-size:14px;line-height:1.6}
  .item-user{background:#2e6bd6;margin-left:auto}
  .item-ai{background:#2a2a30}
  .bar{display:flex;gap:8px;padding:12px;border-top:1px solid #333}
  .ql-editor{flex:1;min-height:44px;background:#222;border-radius:8px;padding:10px;outline:none;overflow-y:auto}
  button{padding:8px 18px;background:#3a3a42;color:#eee;border:0;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="chat" class="agent-chat__list"></div>
<div class="bar">
  <div id="editor" class="ql-editor" contenteditable="true" role="textbox"></div>
  <button id="send">发送</button>
</div>
<script>
  var editor = document.getElementById('editor');
  editor.addEventListener('paste', function (e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (!text) return;
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    sel.getRangeAt(0).deleteContents();
    var node = document.createTextNode(text);
    sel.getRangeAt(0).insertNode(node);
    sel.collapseToEnd();
  });
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]); }); }
  function sendNow() {
    var text = editor.innerText.trim();
    if (!text) return;
    editor.innerText = '';
    var chat = document.getElementById('chat');
    chat.insertAdjacentHTML('beforeend', '<div class="agent-chat__item item-user">' + esc(text) + '</div>');
    var ok = text.indexOf('题目:') >= 0 && text.indexOf('选项:') >= 0;
    var reply = ok ? '收到 ' + text.length + ' 个字符,题目完整。\nA' : '没收到题目(仅 ' + text.length + ' 字符)。';
    setTimeout(function () {
      // 模拟元宝的长消息折叠:默认只显示前 12 字 + 展开 按钮
      var div = document.createElement('div');
      div.className = 'agent-chat__item item-ai';
      div.innerHTML = '<span class="pv">' + esc(reply.slice(0, 12)) + '</span>' +
        '<span class="full" style="display:none">' + esc(reply) + '</span> ' +
        '<button class="expand" style="background:none;border:0;color:#7aa2ff;cursor:pointer;padding:0">展开</button>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      div.querySelector('.expand').addEventListener('click', function () {
        div.querySelector('.pv').style.display = 'none';
        div.querySelector('.full').style.display = 'inline';
        this.textContent = '收起';
      });
    }, 700);
  }
  document.getElementById('send').addEventListener('click', sendNow);
</script>
</body>
</html>

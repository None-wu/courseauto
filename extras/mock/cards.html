<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>任务点卡片(模拟)</title>
<style>
  body { margin: 0; padding: 10px; font: 13px/1.6 "Microsoft YaHei", sans-serif; }
  .card { border: 1px solid #e2e5ee; border-radius: 8px; padding: 8px; margin-bottom: 10px; background: #fbfcff; }
  .card h3 { font-size: 13px; margin: 0 0 6px; color: #4a5163; font-weight: 500; }
  iframe { width: 100%; height: 150px; border: 0; }
  .ans-job-icon { width: 8px; height: 8px; background: #f59e0b; border-radius: 50%; display: inline-block; margin-right: 6px; }
</style>
</head>
<body>
<div id="cards"></div>
<script>
  var ch = Number(new URLSearchParams(location.search).get('ch') || 1);
  var TASKS = {
    1: [
      { id: 'video', name: '1.1 视频任务', src: '/ananas/modules/video/index.html?ch=1' },
      { id: 'work',  name: '1.2 章节测验', src: '/ananas/modules/work/index.html?ch=1' },
      { id: 'pdf',   name: '1.3 文档任务', src: '/ananas/modules/pdf/index.html?ch=1' }
    ],
    2: [
      { id: 'audio', name: '2.1 音频任务', src: '/ananas/modules/audio/index.html?ch=2' },
      { id: 'img',   name: '2.2 图片任务', src: '/ananas/modules/img/index.html?ch=2' }
    ]
  };

  var root = document.getElementById('cards');
  (TASKS[ch] || []).forEach(function (t) {
    var card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + t.id;
    // 注意: icon 与 iframe 必须是兄弟节点,脚本用 icon.parentElement.querySelector('iframe')
    card.innerHTML = '<h3>' + t.name + '</h3>';
    // 任务点图标必须是 iframe 的兄弟节点(脚本用 icon.parentElement.querySelector('iframe'))
    var icon = document.createElement('span');
    icon.className = 'ans-job-icon';
    card.insertBefore(icon, card.firstChild);
    var f = document.createElement('iframe');
    f.setAttribute('data', JSON.stringify({ name: t.name }));
    f.src = t.src;
    card.appendChild(f);
    root.appendChild(card);
  });
</script>
</body>
</html>

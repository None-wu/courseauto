<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock AI (English UI / symmetric bubbles / icon send button / streaming partial)</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
  #scroller{flex:1;overflow-y:auto;padding:16px}
  .msg{max-width:70%;margin:8px 0;padding:10px 14px;border-radius:12px;white-space:pre-wrap;font-size:14px;line-height:1.6;background:#26262b}
  .msg.user{background:#2e6bd6;margin-left:auto}
  .tools{display:flex;gap:8px;margin:4px 0}
  .t-ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
  .t-ic svg{width:16px;height:16px}
  .bar{display:flex;gap:8px;padding:12px;border-top:1px solid #333;align-items:center}
  textarea{flex:1;min-height:44px;background:#1d1d22;color:#eee;border:0;border-radius:8px;padding:10px;outline:none;resize:none}
  .send-btn{width:44px;height:44px;border-radius:50%;background:#3a3a42;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .send-btn svg{width:20px;height:20px;fill:#eee}
  .stop-pill{padding:8px 18px;background:#5a2020;color:#eee;border:0;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="scroller" class="chat-messages"></div>
<div class="bar">
  <textarea id="input" placeholder="Message..."></textarea>
  <div class="t-ic"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" stroke="#888" stroke-width="2" fill="none"/></svg></div>
  <div class="t-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="#888" stroke-width="2" fill="none"/></svg></div>
  <div class="t-ic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" stroke="#888" stroke-width="2" fill="none"/></svg></div>
  <div id="send" class="send-btn" title="Send"><svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></div>
</div>
<script>
  // 模拟:英文界面 + 用户/AI 同类名气泡 + 无文字图标发送键 + 输入条图标排(旧版易误判为操作栏)
  // + 流式输出中途停顿(整卷只答一半就被抓 → 回归测试 expect 门槛)
  var chat = document.getElementById('scroller');
  var input = document.getElementById('input');
  var stopBtn = null;
  var ICONS = '<svg viewBox="0 0 24 24"><path d="M8 8h12v12H8z" fill="none" stroke="#888" stroke-width="2"/></svg>';
  function esc(s){return s.replace(/[&<>]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]);});}
  function toolbar(){ var t='<div class="tools">'; for (var i=0;i<4;i++) t+='<div class="t-ic">'+ICONS+'</div>'; return t+'</div>'; }
  document.getElementById('send').addEventListener('click', function(){
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    chat.insertAdjacentHTML('beforeend','<div class="msg user">'+esc(text)+'</div>');
    chat.scrollTop = chat.scrollHeight;
    stopBtn = document.createElement('button');
    stopBtn.className = 'stop-pill';
    stopBtn.setAttribute('aria-label','Stop generating');
    stopBtn.textContent = '■';
    document.querySelector('.bar').appendChild(stopBtn);

    var batch = text.match(/下面是\s*(\d+)\s*道题/);
    var replyEl = document.createElement('div');
    replyEl.className = 'msg ai';
    replyEl.textContent = '';
    chat.appendChild(replyEl);
    var done = function () {
      if (stopBtn && stopBtn.parentNode) stopBtn.parentNode.removeChild(stopBtn);
      stopBtn = null;
      replyEl.insertAdjacentHTML('afterend', toolbar());
      chat.scrollTop = chat.scrollHeight;
    };

    if (batch) {
      var n = parseInt(batch[1], 10);
      // 第一段:只答前两题(模拟流式输出中途停顿 2.8s)
      setTimeout(function () { replyEl.textContent = '1.A\n2.C'; chat.scrollTop = chat.scrollHeight; }, 700);
      // 第二段:补全全部题号
      setTimeout(function () {
        var lines = [];
        for (var i = 1; i <= n; i++) lines.push(i + '.' + (i % 3 === 0 ? '正确' : (i % 4 === 0 ? 'ABCD' : 'A')));
        replyEl.textContent = lines.join('\n');
        chat.scrollTop = chat.scrollHeight;
        done();
      }, 3500);
    } else {
      var ok = text.indexOf('题目:') >= 0 && text.indexOf('选项:') >= 0;
      setTimeout(function () { replyEl.textContent = ok ? 'B' : 'no question received'; done(); }, 2500);
    }
  });
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>学习通 - 章节学习(模拟)</title>
<style>
  body { font: 14px/1.6 "Microsoft YaHei", sans-serif; margin: 0; padding: 12px; background: #f6f7fb; color: #333; }
  h1 { font-size: 15px; color: #666; margin: 0 0 10px; font-weight: 400; }
  #iframe { width: 100%; height: 560px; border: 1px solid #d8dbe5; background: #fff; border-radius: 6px; }
  #nav { padding: 10px 0; }
  .nextChapter { display: inline-block; padding: 6px 14px; background: #2f6fed; color: #fff;
                 border-radius: 6px; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<h1>学习通 · 章节学习页（本地模拟，结构对齐 /mycourse/studentstudy）</h1>
<iframe id="iframe" src="/cards.html?ch=1"></iframe>
<div id="nav"></div>
<script>
  // 顶层页提供的平台辅助函数(脚本会尝试调用)
  window.scroll2Job = function () { /* noop */ };
  window.__nextChapterClicks = 0;

  function mountNext(ch) {
    var nav = document.getElementById('nav');
    nav.innerHTML = '';
    if (ch >= 2) return;  // 最后一章没有"下一章"
    var btn = document.createElement('a');
    btn.className = 'nextChapter';
    btn.textContent = '下一章';
    btn.onclick = function () {
      window.__nextChapterClicks++;
      document.getElementById('iframe').src = withCh(ch + 1);
      mountNext(ch + 1);
    };
    nav.appendChild(btn);
  }

  var params = new URLSearchParams(location.search);
  var ch = Number(params.get('ch') || 1);
  // 允许测试时指定不同的卡片页(?cards=/cards-direct.html)
  var cardsBase = params.get('cards') || '/cards.html';
  // 卡片页自带查询串时用 & 拼 ch,避免 ?all=1?ch=1 这种坏地址
  function withCh(n) { return cardsBase + (cardsBase.indexOf('?') >= 0 ? '&' : '?') + 'ch=' + n; }
  document.getElementById('iframe').src = withCh(ch);
  mountNext(ch);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>音频任务(模拟)</title>
<style>body{margin:0;padding:8px;font:13px/1.6 "Microsoft YaHei";background:#101218;color:#d6d9e0}
#audio_html5_api{height:60px;background:#1c2030;border-radius:6px}</style></head>
<body>
<div id="audio_html5_api">模拟音频</div>
<script>
  // 用普通元素模拟 <audio>：脚本会读 muted/volume/ended/paused 并调用 play()
  var a = document.getElementById('audio_html5_api');
  var ended = false, paused = false;
  a.muted = false;
  a.volume = 1;
  Object.defineProperty(a, 'ended', { get: function () { return ended; } });
  Object.defineProperty(a, 'paused', { get: function () { return paused; } });
  a.play = function () { paused = false; return Promise.resolve(); };
  setTimeout(function () {
    ended = true; paused = true;
    a.dispatchEvent(new Event('ended'));
    window.__audioDone = true;
  }, 900);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>任务点卡片 · 提交后准确率检测(模拟)</title>
<style>
  body { margin: 0; padding: 10px; font: 13px/1.6 "Microsoft YaHei", sans-serif; }
  .card { border: 1px solid #e2e5ee; border-radius: 8px; padding: 8px; margin-bottom: 10px; background: #fbfcff; }
  .card h3 { font-size: 13px; margin: 0 0 6px; color: #4a5163; font-weight: 500; }
  iframe { width: 100%; height: 460px; border: 0; }
  .ans-job-icon { width: 8px; height: 8px; background: #f59e0b; border-radius: 50%; display: inline-block; margin-right: 6px; }
</style>
</head>
<body>
<div class="card" id="card-work">
  <span class="ans-job-icon"></span>
  <h3>5.1 章节测验(2 题都能填,提交后判分 50%)</h3>
  <iframe id="wf" data='{"name":"5.1 章节测验"}' onload="this.setAttribute('loaded','1')"></iframe>
</div>
<script>
  // redo=0 → 内页不渲染「重做」按钮,用于验证"不可重复提交则不处理"
  // all=1  → 内页两题都判对,用于验证"无错题 = 全对,直接进下一节点"
  // gate=1 → 换用弹窗式判分页(只弹"未达及格线,请重做",无分数无对错图标)
  // 注意:顶层页会再拼一次 ?ch=,所以这里只取需要透传的参数
  var qs = new URLSearchParams(location.search);
  var redo = qs.get('redo') || '';
  var gate = qs.get('gate') === '1';
  var p = [];
  if (redo.indexOf('0') === 0) p.push('redo=0');
  if (qs.get('all') === '1') p.push('all=1');
  var f = document.getElementById('wf');
  f.src = (gate ? '/mooc2/work/dowork-gate' : '/mooc2/work/dowork-acc2') + (p.length ? '?' + p.join('&') : '');
  if (gate) {
    document.querySelector('#card-work h3').textContent = '6.1 章节测验(弹窗式判分:未达及格线,请重做)';
  }
</script>
</body>
</html>

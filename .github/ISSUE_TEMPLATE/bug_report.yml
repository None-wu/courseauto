name: 功能失效 / 报错
description: 某个平台或题型不工作(选择器失配、点不上、不提交等)
title: "[Bug] 平台 + 章节/题型 + 现象"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        平台改版很频繁,定位问题基本都靠**真实页面结构**。请尽量把下面几项填全,
        否则只能靠猜。答题失败时脚本会自动把结构回传到 `extras/probe/`,
        或在面板里提示结构已上报 —— 把那个 json 一起贴上来,通常一次就能修好。

  - type: input
    id: version
    attributes:
      label: 脚本版本
      description: 面板顶部或油猴管理面板里显示的版本号
      placeholder: "1.3.29"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - 学习通(超星)
        - 智慧树(知到)
        - 雨课堂
        - 本机安装向导 / exe
        - 网页 AI 中转
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器 + 油猴
      options:
        - Edge + Tampermonkey
        - Chrome + Tampermonkey
        - Edge + Violentmonkey
        - Chrome + Violentmonkey
        - Safari + Tampermonkey
        - 其他(在描述里写明)
    validations:
      required: true

  - type: input
    id: scene
    attributes:
      label: 出问题的位置
      description: 哪门课、第几章、什么题型/任务点
      placeholder: "安全教育 3.2 章节测验 · 多选题"

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 具体表现 + 面板日志里相关的几行(点 ▼ 展开日志)
      placeholder: |
        多选题点不上,日志提示「选项点击未被页面记录」
        radio=0() 容器=before-after-checkbox
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: 页面结构(可选但强烈建议)
      description: extras/probe/ 下对应时间的 json,或 F12 里题目容器的 outerHTML
      render: json
